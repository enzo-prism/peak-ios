name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # macOS 15 + a pinned Xcode 26 major: reproducible, and required to build the
    # real iOS 26 Liquid Glass code paths (the pre-26 fallback compiles anywhere,
    # but CI should exercise what ships).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Run fast test gate
        env:
          DESTINATION_OS: latest
        run: ./scripts/test.sh
      - name: Upload test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: .build/TestResults.xcresult
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peak-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # macOS 15 + a pinned Xcode 26 major: reproducible, and required to build the
    # real iOS 26 Liquid Glass code paths (the pre-26 fallback compiles anywhere,
    # but CI should exercise what ships).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Run fast test gate
        env:
          DESTINATION_OS: latest
        run: ./scripts/test.sh
      - name: Verify test count and record source
        run: python3 scripts/check-test-results.py .build/TestResults.xcresult 594
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: |
            .build/TestResults.xcresult
            .build/TestResults.receipt.json
          if-no-files-found: ignore
          include-hidden-files: true

  design:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Test iPhone and production iPad navigation
        run: ./scripts/design-check.sh
      - name: Verify complete suites and record source
        run: |
          python3 scripts/check-test-results.py artifacts/design-check/iphone/UnitTests.xcresult 594
          python3 scripts/check-test-results.py artifacts/design-check/iphone/UITests.xcresult 63
          python3 scripts/check-test-results.py artifacts/design-check/ipad/UITests.xcresult 63
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-check-results
          path: artifacts/design-check/
          if-no-files-found: ignore

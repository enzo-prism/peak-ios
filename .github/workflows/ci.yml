name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peak-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    # Verify the shipping SDK and the availability-gated Xcode 26 fallback.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
            minimum: 657
          - runner: xcode-27
            xcode: '27.0'
            minimum: 658
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Run fast test gate
        env:
          DESTINATION_OS: latest
          DESTINATION_NAME: iPhone 18 Pro
        run: ./scripts/test.sh
      - name: Verify test count and record source
        run: python3 scripts/check-test-results.py .build/TestResults.xcresult ${{ matrix.minimum }}
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcode-${{ matrix.xcode }}
          path: |
            .build/TestResults.xcresult
            .build/TestResults.receipt.json
          if-no-files-found: ignore
          include-hidden-files: true

  tests:
    needs: unit_tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both SDK unit suites
        env:
          UNIT_TEST_RESULT: ${{ needs.unit_tests.result }}
        run: test "$UNIT_TEST_RESULT" = success

  device_ui:
    name: UI (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Test production device flows
        env:
          DESIGN_DEVICE: ${{ matrix.device }}
          IPHONE_DESTINATION_NAME: iPhone 18 Pro
          IPAD_DESTINATION_NAME: iPad Pro 13-inch (M5)
        run: ./scripts/design-check.sh
      - name: Verify complete suite and record source
        env:
          DESIGN_DEVICE: ${{ matrix.device }}
        run: |
          if [[ "$DESIGN_DEVICE" == "iphone" ]]; then
            python3 scripts/check-test-results.py artifacts/design-check/iphone/UnitTests.xcresult 658
          fi
          python3 scripts/check-test-results.py "artifacts/design-check/$DESIGN_DEVICE/UITests.xcresult" 82
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-check-${{ matrix.device }}
          path: artifacts/design-check/${{ matrix.device }}/
          if-no-files-found: ignore

  design:
    needs: device_ui
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both device suites
        env:
          DEVICE_UI_RESULT: ${{ needs.device_ui.result }}
        run: test "$DEVICE_UI_RESULT" = success

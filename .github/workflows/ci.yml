name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run fast test gate
        env:
          DESTINATION_OS: latest
        run: ./scripts/test.sh
      - name: Upload test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: .build/TestResults.xcresult
          if-no-files-found: ignore
